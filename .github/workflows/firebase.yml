# Po każdej zmianie na gałęzi main: testy, build i wdrożenie na Firebase Hosting (oraz reguł bazy Firestore).
# Wymaga w repozytorium (Settings → Secrets and variables → Actions):
#   sekret   FIREBASE_SERVICE_ACCOUNT  – klucz konta serwisowego (cały plik JSON)
#   zmienna  FIREBASE_PROJECT_ID       – identyfikator projektu Firebase, np. familytree-bab4e
# Konta użytkowników włączają się dopiero, gdy ustawisz też zmienne (to publiczne identyfikatory, nie sekrety):
#   FIREBASE_API_KEY, FIREBASE_APP_ID  – z Firebase: Ustawienia projektu → Twoje aplikacje → aplikacja internetowa
# Opcjonalnie ochrona przed nadużyciami (App Check, reCAPTCHA v3): zmienna FIREBASE_APPCHECK_KEY (klucz witryny reCAPTCHA).
# Opis krok po kroku: README, sekcje „Wdrożenie” i „Konta, role i prywatność”.
name: Wdrożenie na Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firebase
  cancel-in-progress: true
jobs:
  wdrozenie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      # Reguły dostępu do bazy sprawdzane na emulatorze Firestore – błąd w regułach zatrzymuje wdrożenie.
      - run: npm run test:reguly
      - run: npm run build
        env:
          # Adres główny (bez podkatalogu): sitemap.xml i robots.txt dostają właściwą domenę.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.web.app', vars.FIREBASE_PROJECT_ID) }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APPCHECK_KEY: ${{ vars.FIREBASE_APPCHECK_KEY }}
          NEXT_PUBLIC_FIREBASE_APPCHECK_TYP: ${{ vars.FIREBASE_APPCHECK_TYP }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN || format('{0}.firebaseapp.com', vars.FIREBASE_PROJECT_ID) }}
      - name: Sprawdź konfigurację Firebase (nie wypisuje sekretu)
        env:
          KLUCZ: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJEKT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$PROJEKT" ]; then echo "::error::Brak zmiennej FIREBASE_PROJECT_ID (zakładka Variables)."; exit 1; fi
          if [ -z "$KLUCZ" ]; then echo "::error::Sekret FIREBASE_SERVICE_ACCOUNT jest pusty albo nie istnieje (zakładka Secrets, dokładna nazwa)."; exit 1; fi
          node -e '
            let k;
            try { k = JSON.parse(process.env.KLUCZ); } catch (e) { console.log("::error::Sekret nie jest poprawnym JSON-em – wklej cały plik klucza, od { do }."); process.exit(1); }
            const braki = ["type","project_id","private_key","client_email"].filter((p) => !k[p]);
            if (k.type !== "service_account" || braki.length) { console.log("::error::To nie jest klucz konta serwisowego (brakuje: " + braki.join(", ") + ")."); process.exit(1); }
            if (k.project_id !== process.env.PROJEKT) { console.log("::error::Klucz jest z projektu \"" + k.project_id + "\", a FIREBASE_PROJECT_ID to \"" + process.env.PROJEKT + "\"."); process.exit(1); }
            console.log("Klucz poprawny. Konto serwisowe: " + k.client_email);
          '
      # Reguły Firestore wdrażamy tylko, gdy konta są skonfigurowane. Jeśli konto serwisowe nie ma do tego uprawnień,
      # strona i tak się wdroży – wtedy wklej plik firestore.rules ręcznie w konsoli Firebase (README).
      - name: Wdróż reguły bazy (Firestore)
        id: reguly
        if: vars.FIREBASE_API_KEY != ''
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJEKT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$KLUCZ" > "$RUNNER_TEMP/klucz.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/klucz.json" npx firebase deploy --only firestore:rules --project "$PROJEKT" --non-interactive
          rm -f "$RUNNER_TEMP/klucz.json"
      - name: Ostrzeżenie o regułach
        if: steps.reguly.outcome == 'failure'
        run: echo "::warning::Nie udało się wdrożyć reguł Firestore automatycznie. Wklej zawartość pliku firestore.rules w konsoli Firebase (Firestore → Reguły → Opublikuj) albo nadaj kontu serwisowemu rolę 'Firebase Rules Admin'."
      # Indeks do listy „Ostatnio dodane drzewa”. Bez niego strona działa (pobiera wtedy więcej drzew i sortuje u siebie),
      # więc brak uprawnień nie zatrzymuje wdrożenia. Konto serwisowe potrzebuje roli „Cloud Datastore Index Admin”.
      - name: Wdróż indeksy bazy (Firestore)
        id: indeksy
        if: vars.FIREBASE_API_KEY != ''
        continue-on-error: true
        env:
          KLUCZ: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJEKT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          printf '%s' "$KLUCZ" > "$RUNNER_TEMP/klucz.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/klucz.json" npx firebase deploy --only firestore:indexes --project "$PROJEKT" --non-interactive
          rm -f "$RUNNER_TEMP/klucz.json"
      - name: Ostrzeżenie o indeksach
        if: steps.indeksy.outcome == 'failure'
        run: |
          echo "::warning::Nie udało się wdrożyć indeksu Firestore (lista ostatnio dodanych drzew będzie działać wolniej i zużyje więcej odczytów). Nadaj kontu serwisowemu rolę 'Cloud Datastore Index Admin' albo utwórz indeks w konsoli: kolekcja drzewa, pola widocznosc (rosnąco) i utworzono (malejąco)."
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
